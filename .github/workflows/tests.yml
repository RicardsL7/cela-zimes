# Automātiskie testi (audits A08): katrai izmaiņai main zarā un katram pull request.
# B11 (audits 2): vietne (GitHub Pages) tiek izvietota TIKAI šeit — darbs „deploy” pēc tam, kad visi testi zaļi, un tikai
#   main zarā. Starpposma (sarkani) commit vietnē nenonāk. Robotu commit (OSM dati, vendor, Android) palaiž šo darbplūsmu ar
#   `gh workflow run tests.yml` (GITHUB_TOKEN push citas darbplūsmas nepalaiž). Pages iestatījumos: Source = GitHub Actions.
#   js   — node tests/run.js uz Linux UN Windows (rindu beigas / ceļi nedrīkst ietekmēt rezultātu)
#   sql  — visa datubāzes shēma (supabase/*.sql) tīrā PostgreSQL 16 + drošības scenāriji A01–A04 (tests/run-sql.sh)
#   map  — kartes dūmu tests ar MapLibre no vendor/ (tests/map-smoke.js, Chromium); A10: arī lapu drošības politika (CSP)
# Neizmanto nekādas slepenās atslēgas un nesaskaras ar Supabase / Stripe produkciju.
name: Testi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS testi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.js

  sql:
    name: Datubāzes testi (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql --version
      - run: bash tests/run-sql.sh

  authors:
    name: Commit autori bez personīga e-pasta (B06)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Jaunajos commit tikai GitHub noreply adreses
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash tools/check-authors.sh

  map:
    name: Kartes dūmu tests (MapLibre)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MapLibre vendor/ sakrīt ar vendor/vendor.lock (A10)
        run: bash tools/vendor.sh --check
      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - run: node tests/map-smoke.js . "$RUNNER_TEMP/smoke"
      - name: Bezsaistes režīms (B14)
        run: node tests/offline-smoke.js . "$RUNNER_TEMP/offline"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kartes-tests
          path: |
            ${{ runner.temp }}/smoke.png
            ${{ runner.temp }}/smoke.json
            ${{ runner.temp }}/offline.png
            ${{ runner.temp }}/offline.json
          if-no-files-found: ignore

  deploy:
    name: Vietne (GitHub Pages) — tikai pēc zaļiem testiem (B11)
    needs: [js, sql, authors, map]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Tas pats Jekyll, ko izmantoja „Deploy from a branch” (_config.yml: include .well-known)
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
