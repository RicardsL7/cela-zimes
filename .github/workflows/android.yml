# Ceļa Zīmes — Android lietotne (Capacitor apvalks ap https://growlab.cc ar fona GPS), A14.
#   1) build   — precīzas atkarības (npm ci no mobile/package-lock.json), testa (debug) APK vienmēr;
#                ja GitHub Secrets ir parakstīšanas atslēga — arī parakstīts laidiens: APK (telefonam) un AAB (Google Play),
#                un growlab.cc/.well-known/assetlinks.json (App Links: saites atver lietotni) atjaunojas pats.
#   2) device  — ierīces tests Android emulatorā: instalē, palaiž, pārbauda atļaujas, avārijas, growlab.cc ielādi,
#                spraudņus un to, ka https://growlab.cc saite atveras lietotnē (mobile/scripts/device-test.sh).
#   3) publish — tikai ja ierīces tests izdevās: APK uz laidienu lapu „android-test”
#                (https://github.com/RicardsL7/cela-zimes/releases/download/android-test/cela-zimes.apk).
# Parakstīšanas atslēgu izveido un ievada tikai īpašnieks — sk. mobile/README.md. Šajā failā atslēgu nav.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Atkarības tieši pēc package-lock.json (npm ci)
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::Nav mobile/package-lock.json — palaid Actions → 'Android atkarības (lockfile)'"; exit 1
          fi
          npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Parakstīšanas atslēga (no GitHub Secrets)
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CZ_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Parakstīšanas atslēgas nav (mobile/README.md) — būvē tikai testa APK; telefons to nevarēs atjaunināt virs iepriekšējās versijas"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Android projekts
        run: npx cap add android

      - name: Atļaujas, App Links, versija, paraksts
        env:
          CZ_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/patch-android.js

      - name: Sync
        run: npx cap sync android

      - name: Testa APK (debug)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk ../out/cela-zimes-debug.apk

      - name: Parakstīts laidiens (APK + AAB)
        if: steps.sign.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          CZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CZ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../out/cela-zimes.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/cela-zimes.aab

      - name: assetlinks.json (App Links) no parakstīšanas sertifikāta
        if: steps.sign.outputs.signed == 'true'
        working-directory: .
        env:
          CZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          FP=$(keytool -list -v -keystore "$CZ_KEYSTORE_FILE" -alias "$CZ_KEY_ALIAS" -storepass "$CZ_KEYSTORE_PASSWORD" | sed -n 's/^[[:space:]]*SHA256: *//p' | head -1)
          if ! echo "$FP" | grep -Eq '^([0-9A-F]{2}:){31}[0-9A-F]{2}$'; then echo "::error::Neizdevās nolasīt sertifikāta SHA-256"; exit 1; fi
          echo "Sertifikāta SHA-256: $FP"
          mkdir -p .well-known
          printf '[{\n  "relation": ["delegate_permission/common.handle_all_urls"],\n  "target": {\n    "namespace": "android_app",\n    "package_name": "cc.growlab.celazimes",\n    "sha256_cert_fingerprints": ["%s"]\n  }\n}]\n' "$FP" > .well-known/assetlinks.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known/assetlinks.json
          if git diff --cached --quiet; then echo "assetlinks.json nav mainījies"; exit 0; fi
          git commit -m "A14: .well-known/assetlinks.json (Android App Links)"
          git pull --rebase --autostash
          git push

      - name: Notīra atslēgas failu
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/out/
          retention-days: 30

  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - name: KVM emulatoram
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ierīces tests (Android 14 emulators)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash mobile/scripts/device-test.sh out/cela-zimes-debug.apk device-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test
          path: device-test/
          retention-days: 14

  publish:
    needs: [build, device]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - name: Kuru APK publicē
        run: |
          if [ -f out/cela-zimes.apk ]; then echo "KIND=parakstīts laidiens" >> "$GITHUB_ENV"
          else cp out/cela-zimes-debug.apk out/cela-zimes.apk; echo "KIND=testa versija (nav parakstīta — atjauninot vecā jāizdzēš)" >> "$GITHUB_ENV"; fi
      - name: Publicē laidienu lapā
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Android izmēģinājuma versija
          prerelease: true
          files: out/cela-zimes.apk
          body: |
            Ceļa Zīmes — Android (${{ env.KIND }}); nav no Google Play.
            Lejupielādē cela-zimes.apk telefonā, atļauj instalēt no šī avota un uzinstalē.
            Atrašanās vietai izvēlies „Atļaut, kamēr lieto lietotni” un paziņojumiem — „Atļaut”.
            Ierīces tests (emulators) izdevās. Uzbūvēts no commit ${{ github.sha }}, versija ${{ github.run_number }}.
