# Reizi diennaktī sagatavo Latvijas OpenStreetMap datus stāvēšanas pārbaudei
# (gājēju pārejas, pieturas, pārbrauktuves, ielu stāvēšanas atzīmes, stāvlaukumi)
# un saglabā tos data/osm/. Lietotne tos ielādē no savas lapas — bez Overpass gaidīšanas.
# Var palaist arī ar roku: Actions → "OSM dati (Latvija)" → Run workflow.
name: OSM dati (Latvija)

on:
  schedule:
    - cron: '17 1 * * *'   # katru nakti ~04:17 pēc Latvijas laika
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lejupielādē un sagatavo datus
        run: node tools/build-osm.mjs
      - name: Saglabā izmaiņas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          if git diff --cached --quiet; then echo "Izmaiņu nav"; exit 0; fi
          git commit -m "OSM dati: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
