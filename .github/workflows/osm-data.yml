# Reizi diennaktī sagatavo Latvijas OpenStreetMap datus stāvēšanas pārbaudei
# (gājēju pārejas, pieturas, pārbrauktuves, ielu stāvēšanas atzīmes, stāvlaukumi)
# un saglabā tos data/osm/. Lietotne tos ielādē no savas lapas — bez Overpass gaidīšanas.
# Avots: Geofabrik ikdienas Latvijas izraksts (bez Overpass). Var palaist arī ar roku: Actions → "OSM dati (Latvija)" → Run workflow.
name: OSM dati (Latvija)

on:
  schedule:
    - cron: '17 1 * * *'   # katru nakti ~04:17 pēc Latvijas laika
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lejupielādē Latvijas OSM (Geofabrik)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL --retry 5 --retry-delay 30 -o lv.osm.pbf https://download.geofabrik.de/europe/latvia-latest.osm.pbf
          echo "OSM_TS=$(osmium fileinfo -g header.option.osmosis_replication_timestamp lv.osm.pbf)" >> "$GITHUB_ENV"
          osmium tags-filter lv.osm.pbf n/highway=crossing,bus_stop,speed_camera n/enforcement n/railway=tram_stop,level_crossing n/public_transport=platform \
            wr/amenity=parking w/highway -o f.osm.pbf --overwrite
          osmium export f.osm.pbf -f geojsonseq --add-unique-id=type_id -o f.geojsonseq --overwrite
      - name: Sagatavo datus pa šūnām
        run: node tools/build-osm.mjs --geojsonseq f.geojsonseq
      - name: Saglabā izmaiņas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          if git diff --cached --quiet; then echo "Izmaiņu nav"; exit 0; fi
          git commit -m "OSM dati: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
